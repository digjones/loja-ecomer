<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> 
  <link rel="stylesheet" href="/html/styles/style.css">
  <link rel="stylesheet" href="/html/styles/slide.css">
  <title>loja-ecomer</title>
</head>

<body>
  <header>
    <nav>
      <div class="navTop">
        <div class="navItem">
          <div class="logo">
           <a href="#"><img src="img/logo-resseg2.png" width="100" height="100" alt="Esseg"></a>
          </div>
        </div>
        <div class="navItem">
          <div class="search" id="search">
            <input type="text" placeholder="Buscar..." class="searchInput">
            <img src="./img/searchwhite.png" alt="" class="searchIcon">
          </div>
        </div>

        <div class="menu-topo-direito">
          <div class="iconeMenu" id="icone-whats">
           <a href="#"><i class="fa-brands fa-whatsapp fa-2x"></i></a>
          </div>
          
          <div class="iconeMenu" id="icone-user">
           <a href="#"><i class="fa-regular fa-circle-user fa-2x"></i></a>
          </div>
          <div class="iconeMenu" id="icone-cart">
           <a href="#"><i class="fa-solid fa-cart-shopping fa-2x"></i></a>
          </div>
        </div>  
        
       

        <div class="hamburger" id="hamburger">
         <div></div>
         <div></div>
         <div></div>
        </div>
      </div>

      <div class="navBottom" id="navBottom">
        <h3 class="menuItem">MOUTAIN
          <div class="dropdown"><a href="#">Camisas</a><a href="#">Calças</a><a href="#">Bermudas</a></div>
        </h3>
        <h3 class="menuItem">WORK
          <div class="dropdown"><a href="#">Macacão</a><a href="#">Alforges</a><a href="#">Roupas</a></div>
        </h3>
        <h3 class="menuItem">LANÇAMENTOS
          <div class="dropdown"><a href="#">Moutain</a><a href="#">Work</a></div>
        </h3>
        <h3 class="menuItem">SEGURANÇA
          <div class="dropdown"><a href="#">Calçados</a><a href="#">Luvas</a><a href="#">Capacetes</a></div>
        </h3>
      </div>
    </nav>
  </header>

  <section class="slider">
    <div class="slider-content">

      <!-- RADIOS -->
      <input type="radio" name="btn-radio" id="radio1" checked >
      <input type="radio" name="btn-radio" id="radio2">
      <input type="radio" name="btn-radio" id="radio3">

      <!-- SLIDES -->
      <div class="slide-box primeiro">
        <img class="img-desktop" src="/html/img/slide-1.jpg" alt="">
        <img class="img-mobile" src="/html/slide-1-mob.jpg" alt="">
      </div>
      <div class="slide-box segundo">
        <img class="img-desktop" src="/html/img/slide-2.jpg" alt="">
        <img class="img-mobile" src="/html/img/slide-2-mob.jpg" alt="">
      </div>
      <div class="slide-box terceiro">
        <img class="img-desktop" src="/html/img/slide-3.jpg" alt="">
        <img class="img-mobile" src="/html/img/slide-3-mob.jpg" alt="">
      </div>

      <!-- NAV AUTO -->
      <div class="nav-auto">
        <div class="auto-btn1"></div>
        <div class="auto-btn2"></div>
        <div class="auto-btn3"></div>
      </div>

      <!-- NAV MANUAL -->
      <div class="nav-manual">
        <label for="radio1" class="manual-btn"></label>
        <label for="radio2" class="manual-btn"></label>
        <label for="radio3" class="manual-btn"></label>
      </div>
    </div>
  </section>

  <div class="banner">
      <div class="banner-item">
        <img src="/html/img/banner.jpg" alt="banner">
        <a href="#" class="banner-text">MOUTAIN</a>
      </div>
      <div class="banner-item">
        <img src="/html/img/banner2.jpg" alt="banner">
        <a href="https://exemplo2.com" class="banner-text">WORK</a>
      </div>
  </div>
  

  <section id="product">
    <div class="productContainer">
      <div class="productItem">
        <img src="./img/modelo 1.jpg" alt="" class="productImg">
        <h2 class="productTitle">Camisa Moutain</h2>
        <span class="productPrice">R$ 99,90</span>
        <a href="#">
          <button class="comprarButton">COMPRAR AGORA!</button>
        </a>
      </div>
      <div class="productItem">
        <img src="./img/modelo 2.jpg" alt="" class="productImg">
        <h2 class="productTitle">Calça Moutain</h2>
        <span class="productPrice">R$ 149,90</span>
        <a href="#">
          <button class="comprarButton">COMPRAR AGORA!</button>
        </a>
      </div>
      <div class="productItem">
        <img src="./img/modelo 3.jpg" alt="" class="productImg">
        <h2 class="productTitle">Bermuda Moutain</h2>
        <span class="productPrice">R$ 129,90</span>
        <a href="#">
          <button class="comprarButton">COMPRAR AGORA!</button>
        </a>
      </div>
      <div class="productItem">
        <img src="./img/modelo 4.jpg" alt="" class="productImg">
        <h2 class="productTitle">Camisa Moutain</h2>
        <span class="productPrice">R$ 99,90</span>
        <a href="#">
          <button class="comprarButton">COMPRAR AGORA!</button>
        </a>
      </div>
      <div class="productItem">
        <img src="./img/modelo 5.jpg" alt="" class="productImg">
        <h2 class="productTitle">Calça Moutain</h2>
        <span class="productPrice">R$ 149,90</span>
        <a href="#">
          <button class="comprarButton">COMPRAR AGORA!</button>
        </a>
      </div>
      <div class="productItem">
        <img src="./img/modelo 6.jpg" alt="" class="productImg">
      </div>
  </section>


  <script src="/html/scripts/app.js"></script>
  <script>
  const hamburger = document.getElementById('hamburger');
  const navBottom = document.getElementById('navBottom');
  const menuItems = document.querySelectorAll('.menuItem');

  // Abre/fecha o menu ao clicar no hambúrguer
  hamburger.addEventListener('click', () => {
    navBottom.classList.toggle('active');
  });

  // Permite abrir dropdown ao clicar no mobile
  menuItems.forEach(item => {
    item.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        item.classList.toggle('open');
      }
    });
  });
</script>
  <script src="/html/scripts/slide.js"></script>
</body>

</html>
